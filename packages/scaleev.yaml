# ScaleEV charging for Home Assistant.
# Drop this file in <config>/packages/ (see README for the `packages:` include).
# Credentials come from secrets.yaml (see secrets.example.yaml).

rest_command:
  scaleev_login:
    url: "{{ api }}/drivers/auth/login"
    method: post
    content_type: "application/json"
    payload: '{{ {"email": email, "password": password, "tenantSlug": tenant} | tojson }}'

  scaleev_remote_start:
    url: "{{ api }}/drivers/charging/remote-start/{{ station_id }}"
    method: post
    content_type: "application/json"
    headers:
      authorization: "Bearer {{ token }}"
    payload: '{{ {"connectorId": connector_id | int, "priceFlowType": "kwh", "targetKwh": target_kwh | float} | tojson }}'

  scaleev_live:
    url: "{{ api }}/drivers/charging/live?sessionId={{ session_id }}"
    method: get
    headers:
      authorization: "Bearer {{ token }}"

script:
  scaleev_start_charging:
    alias: ScaleEV - start charging
    description: >-
      Logs in, requests a remote start, sends an actionable "Pay now" notification
      if Stripe Checkout is required (first session), waits for the payment hold
      to be authorized, then notifies success or failure.
    mode: single
    icon: mdi:ev-station
    fields:
      station_id:
        name: Station ID
        description: ScaleEV station UUID (see README for how to find it).
        required: true
        selector:
          text:
      connector_id:
        name: Connector ID
        default: 1
        selector:
          number:
            min: 1
            max: 10
            mode: box
      target_kwh:
        name: Target energy (kWh)
        description: Set this to your vehicle's usable battery capacity.
        required: true
        selector:
          number:
            min: 1
            max: 250
            step: 0.5
            unit_of_measurement: kWh
            mode: box
      notify_service:
        name: Notify action
        description: Full notify action name, e.g. notify.mobile_app_my_phone
        required: true
        selector:
          text:
      pay_timeout_minutes:
        name: Payment timeout (minutes)
        default: 10
        selector:
          number:
            min: 1
            max: 60
            mode: box
    variables:
      api: !secret scaleev_api_base
      email: !secret scaleev_email
      password: !secret scaleev_password
      tenant: !secret scaleev_tenant_slug
      login: null
      start: null
      sid: "{{ station_id }}"
      timeout_min: "{{ pay_timeout_minutes | default(10) | int }}"
    sequence:
      # ---- 1. log in -------------------------------------------------------
      - action: rest_command.scaleev_login
        data:
          api: "{{ api }}"
          email: "{{ email }}"
          password: "{{ password }}"
          tenant: "{{ tenant }}"
        response_variable: login
        continue_on_error: true
      - variables:
          token: >-
            {{ login.content.data.access_token
               if (login is mapping and login.content is mapping and login.content.data is mapping)
               else '' }}
      - if: "{{ token == '' or token is none }}"
        then:
          - action: "{{ notify_service }}"
            data:
              title: "ScaleEV: login failed"
              message: "Could not log in (HTTP {{ login.status if login is mapping else 'no response' }}). Check your secrets."
          - stop: "ScaleEV login failed"
            error: true

      # ---- 2. request remote start ----------------------------------------
      - action: rest_command.scaleev_remote_start
        data:
          api: "{{ api }}"
          token: "{{ token }}"
          station_id: "{{ station_id }}"
          connector_id: "{{ connector_id | default(1) }}"
          target_kwh: "{{ target_kwh }}"
        response_variable: start
        continue_on_error: true
      - variables:
          start_ok: >-
            {{ start is mapping and start.content is mapping
               and start.content.success == true and start.content.data is mapping }}
          session_id: "{{ start.content.data.sessionId if start_ok else '' }}"
          checkout_url: "{{ start.content.data.checkoutUrl | default('', true) if start_ok else '' }}"
          needs_payment: "{{ start_ok and checkout_url != '' and (start.content.data.paymentStatus | default('')) == 'pending' }}"
          start_error: >-
            {% if start is mapping and start.content is mapping %}{{ start.content.message | default('unknown error') }}
            {% else %}no response from ScaleEV{% endif %}
      - if: "{{ not start_ok }}"
        then:
          - action: "{{ notify_service }}"
            data:
              title: "ScaleEV: could not start charging"
              message: >-
                {{ start_error | trim }} (station {{ station_id }}, connector {{ connector_id | default(1) }}).
          - stop: "ScaleEV remote start failed"
            error: true

      # ---- 3. payment (first session only) --------------------------------
      - if: "{{ needs_payment }}"
        then:
          - action: "{{ notify_service }}"
            data:
              title: "ScaleEV: payment needed"
              message: "Tap to authorize payment and start charging ({{ target_kwh }} kWh)."
              data:
                tag: scaleev_pay
                clickAction: "{{ checkout_url }}"
                url: "{{ checkout_url }}"
                actions:
                  - action: URI
                    title: Pay now
                    uri: "{{ checkout_url }}"

      # ---- 4. wait for the hold to be authorized --------------------------
      - variables:
          max_polls: "{{ (timeout_min * 6) if needs_payment else 12 }}"
      - repeat:
          sequence:
            - delay: "00:00:10"
            - action: rest_command.scaleev_live
              data:
                api: "{{ api }}"
                token: "{{ token }}"
                session_id: "{{ session_id }}"
              response_variable: poll
              continue_on_error: true
          until: >-
            {{ (poll is defined and poll is mapping and poll.content is mapping
                and poll.content.data is mapping
                and poll.content.data.paymentStatus in ['authorized', 'captured'])
               or repeat.index >= max_polls }}
      - action: rest_command.scaleev_live
        data:
          api: "{{ api }}"
          token: "{{ token }}"
          session_id: "{{ session_id }}"
        response_variable: final
        continue_on_error: true
      - variables:
          final_data: >-
            {{ final.content.data if (final is defined and final is mapping
               and final.content is mapping and final.content.data is mapping) else {} }}
          authorized: "{{ final_data.paymentStatus | default('') in ['authorized', 'captured'] }}"

      # ---- 5. report -------------------------------------------------------
      - if: "{{ needs_payment }}"
        then:
          - action: "{{ notify_service }}"
            data:
              message: clear_notification
              data:
                tag: scaleev_pay
      - choose:
          - conditions: "{{ authorized }}"
            sequence:
              - action: "{{ notify_service }}"
                data:
                  title: "ScaleEV: charging started"
                  message: >-
                    Session {{ final_data.status | default('started') }} at
                    {{ final_data.stationName | default(station_id) }} ({{ target_kwh }} kWh target).
        default:
          - action: "{{ notify_service }}"
            data:
              title: "ScaleEV: charging did not start"
              message: >-
                {% if needs_payment %}Payment was not completed within {{ timeout_min }} minutes.
                {% else %}Session was not confirmed (status: {{ final_data.status | default('unknown') }}).{% endif %}
