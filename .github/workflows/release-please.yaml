name: Release
# Opens/updates a "release" pull request from conventional-commit titles on main
# (fix: -> patch, feat: -> minor, feat!: -> breaking). Merging that PR bumps
# manifest.json, updates CHANGELOG.md, then tags and publishes the GitHub release.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
